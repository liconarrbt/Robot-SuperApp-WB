services:
  redroid:
    image: redroid/redroid:11.0.0-latest
    container_name: redroid-gps
    privileged: true
    restart: unless-stopped
    ports:
      - "5555:5555" # ADB port
    volumes:
      - ./data:/data
      - ./empty_xbin:/system/xbin:ro
    devices:
      # VK-162 USB GPS passthrough
      - /dev/ttyACM0:/dev/ttyACM0:rwm
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_gpu_mode=guest
      # Habilitar soporte GPS serial en el kernel/AOSP HAL si está disponible
      - ro.kernel.android.gps=ttyACM0
      - ro.kernel.android.gps.speed=9600
      # Ocultar firmas de depuración y root (Bypass JailMonkey / RootBeer)
      - ro.build.tags=release-keys
      - ro.build.type=user
      - ro.debuggable=0
      - ro.secure=1
